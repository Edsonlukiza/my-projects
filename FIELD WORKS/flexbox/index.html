<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox and Grid</title>
    <link rel="stylesheet" href="css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>
    
    <div class="container">
        <div class="left-flex-container">
            <p class="p"><b>Your Result</b></p>
            <div class="score-circle">
                <h1><b>76</b></h1> 
                <p class="p"> of 100</p> 
            </div> 
            <div>
                <h2>Great</h2>
                <p class="p">You scored higher than 65% of the people who have taken these tests.</p>
            </div>
        </div>

        <div class="right-flex-container">
            <h3>Summary</h3> 
            <div class="reaction icon-text">
              <img src="/assets/images/icon-reaction.svg" alt="Reaction Icon">
              <p>Reaction</p>
              <span><span class="part1">80</span><span class="slash"> / </span><span class="part2">100</span></span>
          </div>
          
          <div class="memory icon-text">
              <img src="/assets/images/icon-memory.svg" alt="Memory Icon">
              <p>Memory</p>
              <span><span class="part1">92</span><span class="slash"> / </span><span class="part2">100</span></span>
          </div>
          
          <div class="verbal icon-text">
              <img src="/assets/images/icon-verbal.svg" alt="Verbal Icon">
              <p>Verbal</p>
              <span><span class="part1">61</span><span class="slash"> / </span><span class="part2">100</span></span>
          </div>
          
          <div class="visual icon-text">
              <img src="/assets/images/icon-visual.svg" alt="Visual Icon">
              <p>Visual</p>
              <span><span class="part1">73</span><span class="slash"> / </span><span class="part2">100</span></span>
          </div>
          
            <div class="button">
                <button>Continue</button>
            </div>
        </div>
    </div>

</body>
</html>
